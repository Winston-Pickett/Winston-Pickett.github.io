name: European Readiness setup
on:
  push:
    branches: [add-european-readiness-2026-10-15]
    paths: [.github/workflows/european-readiness-setup.yml]
permissions:
  contents: write
jobs:
  prepare-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-c898-81f7-898e-b9800599dadb/raw?se=2026-10-16T00%3A02%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=7dc935ca-e8b9-5c67-b913-4a124ff6b7de&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T22%3A11%3A27Z&ske=2026-10-16T22%3A11%3A27Z&sks=b&skv=2026-02-06&sig=Uxw283xuX1Cvr6nIZ5Octd4drRj3JyRHHfTk%2BIPfkWI%3D'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Retrieve and verify the isolated publication bundle
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, urllib.request, hashlib, zipfile, io, subprocess
          raw=urllib.request.urlopen(os.environ['BUNDLE_URL'],timeout=60).read()
          assert hashlib.sha256(raw).hexdigest()=='29dde35aed58b1516f4d2ba9ab65734cac1f28a9657b58a76df09831f6da9848', 'Transfer integrity failure'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'readiness-bundle'
          target.mkdir()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist())
              z.extractall(target)
          subprocess.run(['python',str(target/'apply.py'),os.environ['GITHUB_WORKSPACE']],check=True)
          PY
      - name: Install browser validation tools
        run: |
          python -m pip install --quiet playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify desktop, mobile, cross-section navigation, and the original PDF
        run: python "$RUNNER_TEMP/readiness-bundle/test_browser.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/readiness-review"
      - name: Commit only the new section and navigation links
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, json, subprocess
          m=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'readiness-bundle/manifest.json').read_text())
          paths=list(m['navigation_changes'])+list(m['new_files'])
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--']+paths,check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(staged)==set(paths), 'Unexpected staged paths'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Add European Readiness archive and October 15 edition; navigation-only changes elsewhere'],check=True)
          subprocess.run(['git','push','origin','HEAD:add-european-readiness-2026-10-15'],check=True)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'readiness-review'
          subprocess.run(['git','archive','--format=zip','--output='+str(out/'reviewed-site.zip'),'HEAD'],check=True)
          (out/'preservation-manifest.json').write_text(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: european-readiness-review
          path: ${{ runner.temp }}/readiness-review/
          retention-days: 3
