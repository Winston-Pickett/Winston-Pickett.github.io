name: European Readiness setup
on:
  push:
    branches: [add-european-readiness-2026-10-15]
    paths: [.github/workflows/european-readiness-setup.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fe6d08ba01270064962fd36c296259cc985611e4
      - name: Archive unchanged site for local validation
        run: git archive --format=zip --output=site-before.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: european-readiness-site-before
          path: site-before.zip
          retention-days: 1
