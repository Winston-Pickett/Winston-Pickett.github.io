name: Stage Europe Readiness archive assets
on:
  push:
    branches: [erd-archive-repair-2026-11-11]
    paths: [.github/workflows/erd-archive-transfer.yml]
permissions:
  contents: write
jobs:
  stage-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and store original binary files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          assets = [
            ('2026-11-09',1253825,'a9313ebfec3ce48f0c33da63dcd6291b05e7bc73a157d4b3da0f23beece1b25e','3afef0ce394a6656dddabbe2b0afd8f60d59361e','https://sdmntpreastus3.oaiusercontent.com/files/00000000-52e0-8212-a812-15572035569d/raw?se=2026-11-11T20%3A53%3A33Z&sp=r&sv=2026-06-06&sr=b&scid=bb42acc4-c49a-5600-9800-386ab263f83c&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T20%3A46%3A04Z&ske=2026-11-12T20%3A46%3A04Z&sks=b&skv=2026-06-06&sig=P71n7PFe6QcedP8bbQPjz6gB8EWOQHiVwTXad3m5t5s%3D'),
            ('2026-11-10',1197274,'c91c943ff3256c76a4f9245f213f313a41ce400cc573c2ecc0ad4c1aaa61d979','e499f1fbbe25db32aa7fa316df150a789f3aa5bc','https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-8110-81f7-8924-d09c82df5a89/raw?se=2026-11-11T20%3A53%3A01Z&sp=r&sv=2026-06-06&sr=b&scid=026396d5-b271-58cd-b187-8650fc89840c&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T20%3A44%3A24Z&ske=2026-11-12T20%3A44%3A24Z&sks=b&skv=2026-06-06&sig=NZ2o42rZ0/aU%2BssWMA7yOZvvE2D4kaJtferMS7FIecU%3D'),
            ('graphic',307152,'5e8e43cafe5a4f09df525bb7951694f2f568b657aebaab332b7004774a945b80','a3eaf3448a7ed9006bfa1188b813a0febdc45d82','https://sdmntpreastus3.oaiusercontent.com/files/00000000-ac44-8212-865d-f6e7d785390c/raw?se=2026-11-11T20%3A53%3A21Z&sp=r&sv=2026-06-06&sr=b&scid=3dfa102a-1d15-5466-b840-2390daf3ec3c&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T20%3A46%3A14Z&ske=2026-11-12T20%3A46%3A14Z&sks=b&skv=2026-06-06&sig=yTTHQpRJ3Jo9xHLYcPdeyG1ttCimLg6n8ogEpLNc2vA%3D')
          ]
          result = {}
          for label, size, sha256, blob, url in assets:
            print('::add-mask::'+url)
            try:
              with urllib.request.urlopen(url,timeout=60) as response:
                data=response.read(size+1)
            except Exception as error:
              raise SystemExit(label+' transfer failed: '+type(error).__name__)
            assert len(data)==size and hashlib.sha256(data).hexdigest()==sha256, label+' content mismatch'
            assert data.startswith(b'\xff\xd8') if label=='graphic' else data.startswith(b'%PDF-'), label+' format mismatch'
            expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            assert expected==blob
            req=urllib.request.Request('https://api.github.com/repos/Winston-Pickett/Winston-Pickett.github.io/git/blobs',method='POST',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'ERD-Archive-Transfer'})
            with urllib.request.urlopen(req,timeout=60) as response: obj=json.load(response)
            assert obj['sha']==blob
            result[label]={'blob':blob,'bytes':size,'sha256':sha256}
          print('VERIFIED_ARCHIVE_ASSETS='+json.dumps(result,sort_keys=True))
          print('Main branch, public pages, schedules and repository settings unchanged.')
          PY
