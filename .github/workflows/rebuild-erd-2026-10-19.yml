name: Build revised Europe Readiness Daily 2026-10-19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-erd-2026-10-19.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-review-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-liberation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf python-docx pillow lxml

      - name: Restore revision builder
        shell: bash
        run: |
          cat > /tmp/rebuild.py.gz.b64 <<'B64'
