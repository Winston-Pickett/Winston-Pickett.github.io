name: Diagnose October 19 revision builder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-erd-2026-10-19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect embedded revision builder
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, traceback
          source_path = Path('.github/workflows/rebuild-erd-2026-10-19.yml')
          source = source_path.read_text(encoding='utf-8')
          marker = "cat > /tmp/rebuild.py.gz.b64 <<'B64'\n"
          lines = []
          lines.append(f'source_bytes={source_path.stat().st_size}')
          lines.append(f'marker_found={marker in source}')
          try:
              after = source.split(marker, 1)[1]
              payload = after.splitlines()[0].strip()
              lines.append(f'payload_len={len(payload)}')
              lines.append(f'payload_prefix={payload[:24]}')
              lines.append(f'payload_suffix={payload[-24:]}')
              raw = base64.b64decode(payload)
              lines.append(f'decoded_len={len(raw)}')
              lines.append(f'decoded_sha256={hashlib.sha256(raw).hexdigest()}')
              script = gzip.decompress(raw)
              lines.append(f'script_len={len(script)}')
              lines.append(f'script_sha256={hashlib.sha256(script).hexdigest()}')
              lines.append(f'script_prefix={script[:120]!r}')
          except Exception as exc:
              lines.append(f'exception_type={type(exc).__name__}')
              lines.append(f'exception={exc!r}')
              lines.append(traceback.format_exc())
          out = Path('european-readiness/build/2026-10-19/restore-diagnostic.txt')
          out.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(out.read_text())
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Winston-Pickett'
          git config user.email 'wpick11@gmail.com'
          git add european-readiness/build/2026-10-19/restore-diagnostic.txt
          git commit -m 'Record October 19 revision builder diagnostic'
          git pull --rebase origin main
          git push origin main
