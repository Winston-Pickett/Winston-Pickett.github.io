name: Publish Europe Readiness 2026-11-17 PDF
on:
  push:
    branches: [main]
    paths:
      - 'european-readiness/editions/2026-11-17-pdf-parts/ready.flag'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reassemble and validate the original linked-source PDF
        shell: bash
        run: |
          set -euo pipefail
          dst="european-readiness/editions/Europe_Readiness_Daily_2026-11-17.pdf"
          cat european-readiness/editions/2026-11-17-pdf-parts/part-*.txt | tr -d '\r\n' | base64 --decode > "$dst"
          test "$(stat -c %s "$dst")" -eq 2492104
          printf '%s  %s\n' 'dc3f825405e8f36a922be3d111fabdea510bb54fededac3a6a27c6474e4e7dca' "$dst" | sha256sum --check
          head -c 5 "$dst" | grep -F '%PDF-'
      - name: Commit full PDF and remove transport parts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add european-readiness/editions/Europe_Readiness_Daily_2026-11-17.pdf
          git rm -r --quiet european-readiness/editions/2026-11-17-pdf-parts/
          git commit -m "Finalize Europe Readiness November 17 linked-source PDF"
          git push origin HEAD:main
